name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity normal

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token issuance for NuGet trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: dotnet pack Utility/Utility.csproj --configuration Release --output artifacts
      - name: NuGet.org login (OIDC -> temp API key)
        # Trusted publishing (org standard; the long-lived NUGET_API_KEY secret is
        # gone): this job's GitHub OIDC token is exchanged for a ~1-hour nuget.org
        # API key, validated against the trusted publishing policy registered on
        # nuget.org for this repository + workflow:
        #   Repository Owner: DevelApp-ai
        #   Repository:      Utility
        #   Workflow File:   dotnet-core.yml
        #   Environment:     (none - this job uses no environment)
        # NUGET_USER = the nuget.org profile name of the owning account (NOT an
        # email address). The login runs close to the push (the temp key is
        # short-lived). Fails loudly if the policy is not (yet) registered.
        id: nuget-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        # Keyless trusted-publishing key from the login step above. The push
        # output is captured so the exact nuget.org response (status code +
        # reason) lands in the job summary and the check-run annotations:
        # the 2026-11-12/13 failures showed only 'exit code 1' with no
        # visible error text anywhere. The API key itself is never echoed
        # (length only).
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set +e
          output=$(dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1)
          code=$?
          set -e
          echo "$output"
          {
            echo "### Publish to NuGet.org"
            echo '```'
            echo "$output"
            echo '```'
            echo "api key length: ${#NUGET_API_KEY}"
            echo "exit code: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            err_tail=$(echo "$output" | grep -v '^[[:space:]]*$' | tail -2 | tr '\n' ' ')
            echo "::error::dotnet nuget push failed (exit $code), api key length ${#NUGET_API_KEY}: $err_tail"
            exit "$code"
          fi
